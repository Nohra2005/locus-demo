# LOCUS: deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: locus/gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: frontend-dist
              mountPath: /app/frontend/dist
            - name: users-data
              mountPath: /app/users.json
            - name: link-report
              mountPath: /app/link_health_report.json
            - name: whitelist-data
              mountPath: /app/pending_whitelist.json
          envFrom:
            - configMapRef:
                name: locus-config
          env:
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: locus-secrets
                  key: QDRANT_API_KEY
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: locus-secrets
                  key: OPENROUTER_API_KEY
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: locus-secrets
                  key: GOOGLE_API_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: locus-secrets
                  key: JWT_SECRET
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: locus-secrets
                  key: ADMIN_API_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: frontend-dist
          hostPath:
            path: /home/azureuser/locus/frontend/dist
            type: Directory
        - name: users-data
          hostPath:
            path: /home/azureuser/locus/gateway/users.json
            type: FileOrCreate
        - name: link-report
          hostPath:
            path: /home/azureuser/locus/gateway/link_health_report.json
            type: FileOrCreate
        - name: whitelist-data
          hostPath:
            path: /home/azureuser/locus/pending_whitelist.json
            type: FileOrCreate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: visual-engine
  labels:
    app: visual-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: visual-engine
  template:
    metadata:
      labels:
        app: visual-engine
    spec:
      containers:
        - name: visual-engine
          image: locus/visual-engine:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8001
          env:
            - name: TRANSFORMERS_CACHE
              value: /root/.cache/huggingface
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "1500m"
              memory: "3Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 90
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: attribute-tagger
  labels:
    app: attribute-tagger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attribute-tagger
  template:
    metadata:
      labels:
        app: attribute-tagger
    spec:
      containers:
        - name: attribute-tagger
          image: locus/attribute-tagger:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8004
          env:
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: locus-secrets
                  key: OPENROUTER_API_KEY
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: locus-secrets
                  key: GOOGLE_API_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "300m"
              memory: "384Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-exporter
  labels:
    app: mlops-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlops-exporter
  template:
    metadata:
      labels:
        app: mlops-exporter
    spec:
      containers:
        - name: mlops-exporter
          image: locus/mlops-exporter:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: locus-config
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "150m"
              memory: "192Mi"
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 15
