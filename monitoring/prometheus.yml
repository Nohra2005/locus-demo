global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:

  - job_name: 'gateway'
    static_configs:
      - targets: ['host.docker.internal:30800']

  - job_name: 'visual_engine'
    static_configs:
      - targets: ['host.docker.internal:30801']

  - job_name: 'attribute_tagger'
    static_configs:
      - targets: ['host.docker.internal:30804']

  - job_name: 'mlops_exporter'
    static_configs:
      - targets: ['host.docker.internal:30803']
