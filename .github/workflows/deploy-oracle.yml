name: Deploy to Oracle

# After CI passes on main: build the ARM image, publish it to GitHub's
# container registry, restart it on the Oracle VM, and run the end-to-end
# tests against the live site.
#
# One-time setup (repo Settings > Secrets and variables > Actions):
#   secret   ORACLE_SSH_KEY  private key for the VM's "ubuntu" user
#   variable ORACLE_HOST     the VM's public IP
# Until ORACLE_HOST is set, only the image is published. The first deploy
# also runs deploy/oracle/setup.sh on the VM, so no manual SSH is needed.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/nohra2005/locus-demo:latest,ghcr.io/nohra2005/locus-demo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: ${{ vars.ORACLE_HOST != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up the VM (first run) and restart Locus with the new image
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          HOST: ${{ vars.ORACLE_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "$SSH_KEY" > key && chmod 600 key
          SSH="ssh -i key -o StrictHostKeyChecking=no ubuntu@$HOST"
          # Idempotent: installs Docker, opens ports 80/443, writes ~/locus/.env with the sslip.io domain
          $SSH 'NO_START=1 bash -s' < deploy/oracle/setup.sh
          scp -i key -o StrictHostKeyChecking=no deploy/oracle/docker-compose.yml deploy/oracle/Caddyfile ubuntu@$HOST:~/locus/
          # The image is private on GHCR: log in for this pull only, then log out
          echo "$GHCR_TOKEN" | $SSH "sudo docker login ghcr.io -u $GHCR_USER --password-stdin"
          $SSH 'cd ~/locus && sudo docker compose --env-file .env pull && sudo docker compose --env-file .env up -d && sudo docker image prune -f; sudo docker logout ghcr.io'
          rm key

      - name: End-to-end tests against the live site
        env:
          HOST: ${{ vars.ORACLE_HOST }}
        run: |
          URL="https://$(echo "$HOST" | tr . -).sslip.io"
          timeout 600 bash -c "until curl -sf $URL/health >/dev/null; do sleep 15; done"
          pip install pytest requests pillow
          GATEWAY_URL=$URL pytest tests/test_e2e.py -v
